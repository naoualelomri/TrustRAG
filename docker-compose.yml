services:

  backend:
    build:
      context: ./backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_db:/app/chroma_db
      - huggingface_cache:/root/.cache/huggingface


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  huggingface_cache: